[package]
name = "louis-capi"
version = "0.1.0"
edition = "2024"
description = "C API for louis-rs, a pure Rust re-implementation of the liblouis braille translator"
repository = "https://github.com/liblouis/louis-capi"
readme = "README.md"
license = "LGPL-2.1-or-later"
keywords = ["braille", "liblouis", "accessibility", "ffi"]
categories = ["accessibility", "text-processing", "external-ffi-bindings"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
louis-rs = "0.4.1"

[features]
# cargo-c builds with this feature and refuses a crate without it
capi = []

# cargo-c (`cargo cinstall`) installs liblouis-rs.so, louis-rs/louis.h and louis-rs.pc.
# The soname follows this crate's version, which changes only when the C API does.
[package.metadata.capi.library]
name = "louis-rs"

[package.metadata.capi.header]
name = "louis"
subdirectory = "louis-rs"
generation = false

[package.metadata.capi.pkg_config]
name = "louis-rs"
filename = "louis-rs"
# Cflags: -I${includedir}, so that C includes <louis-rs/louis.h>
strip_include_path_components = 1

# The header is generated by hand with cbindgen and committed
[package.metadata.capi.install.include]
asset = [{ from = "include/louis.h", to = "louis-rs" }]
